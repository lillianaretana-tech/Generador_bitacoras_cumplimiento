<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=2.0">
<title>Generador de Bitácoras de Limpieza</title>
<style>
  :root{
    --ink:#1c2b2b; --paper:#f6f4ee; --card:#ffffff;
    --teal:#0e5c53; --teal-dark:#093f39; --amber:#c98a2c;
    --ok:#2f7d4f; --no:#b8462f; --line:#dfd9c8; --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Segoe UI",Roboto,Arial,sans-serif;font-size:17px;line-height:1.35;padding-bottom:70px;}
  header{background:var(--teal);color:#fdfaf2;padding:16px;position:sticky;top:0;z-index:20;box-shadow:0 2px 8px rgba(0,0,0,.15);}
  header h1{font-size:19px;margin:0;font-weight:700;}
  header .sub{font-size:13px;opacity:.85;margin-top:2px;}
  main{padding:14px;max-width:760px;margin:0 auto;}
  .card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);border:1px solid var(--line);}
  .card h2{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--teal-dark);margin:0 0 10px;}
  label{display:block;font-size:13px;color:#5b6560;margin:8px 0 3px;font-weight:600;}
  input[type=text],input[type=number],select{width:100%;font-size:16px;padding:9px 10px;border-radius:9px;border:1.5px solid var(--line);background:#fffefb;color:var(--ink);font-family:inherit;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .btn{display:inline-block;background:var(--teal);color:#fdfaf2;border:none;font-size:16px;font-weight:700;padding:13px 16px;border-radius:11px;text-align:center;width:100%;margin-top:6px;cursor:pointer;}
  .btn.secondary{background:transparent;color:var(--teal-dark);border:1.5px solid var(--teal);}
  .btn.amber{background:var(--amber);}
  .btn.small{width:auto;padding:8px 12px;font-size:13.5px;}
  .btn:disabled{opacity:.5;}
  .row{display:flex;gap:8px;align-items:center;}
  .locrow{border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:9px;background:#fffefb;}
  .locrow .toprow{display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .locrow .toprow label{margin:0;display:flex;align-items:center;gap:7px;font-weight:700;font-size:15px;}
  .locrow input[type=checkbox]{width:20px;height:20px;}
  .hint{font-size:12.5px;color:#7a8079;margin-top:6px;}
  .status{font-size:13.5px;padding:9px 11px;border-radius:9px;margin-top:8px;display:none;}
  .status.ok{background:#e2f1e6;color:var(--ok);display:block;}
  .status.err{background:#fbe3dd;color:var(--no);display:block;}
  .status.loading{background:#fbecd4;color:var(--amber);display:block;}
  .fab-add{background:var(--amber);color:#fff;border:none;border-radius:11px;padding:11px 14px;font-weight:700;font-size:15px;width:100%;margin-bottom:12px;cursor:pointer;}
  .actionbar{display:flex;gap:8px;flex-wrap:wrap;}
  .actionbar .btn{width:auto;flex:1;min-width:140px;}
  .filehidden{display:none;}
  .counter{font-size:13px;color:#5b6560;margin-top:4px;}
  .proyblock{border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:10px;background:#fffefb;}
  .proyblock h3{margin:0 0 8px;font-size:15px;color:var(--teal-dark);}
  .proyblock .lbl{font-size:13px;color:#5b6560;font-weight:600;margin:10px 0 5px;}
  .chips{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .chip{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:7px 1px;font-size:13px;font-weight:700;text-align:center;cursor:pointer;line-height:1.2;min-height:46px;font-family:inherit;}
  .chip small{display:block;font-weight:600;font-size:11px;color:#7a8079;}
  .chip.na{background:var(--no);border-color:var(--no);color:#fff;}
  .chip.na small{color:#fff;}
  .chip{min-width:0;}
  .chip.ok{border-color:var(--ok);color:var(--ok);}
  .chip.ok small{color:var(--ok);}
  .chip:disabled{opacity:.45;cursor:default;}
  .resumenNA{font-size:13.5px;margin-top:9px;padding:8px 10px;border-radius:9px;background:#fbecd4;color:#7a5410;}
  .resumenNA.ninguno{background:#e2f1e6;color:var(--ok);}
  details.extradias{margin-top:9px;}
  details.extradias summary{font-size:13px;font-weight:600;color:var(--teal-dark);cursor:pointer;}
</style>
</head>
<body>
<header>
  <h1>Generador de Bitácoras de Limpieza</h1>
  <div class="sub">OP-F-12 · Word listo para imprimir</div>
</header>
<main id="app">
  <div class="card" id="engineCard">
    <h2>Estado del motor</h2>
    <div id="engineStatus" class="status loading">Cargando motor de documentos... (necesita internet la primera vez)</div>
  </div>
</main>

function isoToDDMMYYYY(iso){
  if(!iso) return "";
  const [y,m,d] = iso.split("-");
  if(!y||!m||!d) return iso;
  return `${d}/${m}/${y}`;
}

/* ---------- CARGA DE LIBRERIAS (con respaldo de CDN) ---------- */
function loadScriptSeq(urls){
  return new Promise((resolve, reject)=>{
    let i=0;
    function tryNext(){
      if(i>=urls.length){ reject(new Error('No se pudo cargar ninguna fuente')); return; }
      const s = document.createElement('script');
      s.src = urls[i];
      s.onload = ()=>resolve();
      s.onerror = ()=>{ i++; tryNext(); };
      document.head.appendChild(s);
    }
    tryNext();
  });
}

/* ---------- helper: base64 -> Uint8Array ---------- */
function b64ToBytes(b64){
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}

function parseISO(iso){
  const m = String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  return m ? new Date(+m[1], +m[2]-1, +m[3]) : null;
}
function toISO(d){
  const p = n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function fmtDM(d){ return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'); }
// fecha de cada día de la semana (0=Lunes) dentro del periodo; null si el periodo no lo incluye
function fechasSemana(){
  const out = [null,null,null,null,null,null,null];
  const ini = parseISO(STATE.periodo.fechaInicioISO);
  if(!ini) return out;
  const fin = parseISO(STATE.periodo.fechaFinalISO);
  const last = (fin && fin>=ini) ? fin : new Date(ini.getFullYear(), ini.getMonth(), ini.getDate()+6);
  for(let i=0;i<7;i++){
    const d = new Date(ini.getFullYear(), ini.getMonth(), ini.getDate()+i);
    if(d>last) break;
    const w = (d.getDay()+6)%7;
    if(!out[w]) out[w] = d;
  }
  return out;
}
function habitualesDe(proy){ return STATE.habituales[normProy(proy)] || []; }
function esNAsemana(proy, w, fechas){
  let na = habitualesDe(proy).indexOf(w) >= 0;
  const d = fechas[w];
  if(d){
    const k = normProy(proy)+'|'+toISO(d);
    if(Object.prototype.hasOwnProperty.call(STATE.excepciones, k)) na = !!STATE.excepciones[k];
  }
  return na;
}
function diasNAde(loc){
  const fechas = fechasSemana(), proy = projOf(loc), set = new Set();
  for(let w=0; w<7; w++) if(esNAsemana(proy, w, fechas)) set.add(w);
  (loc.diasNA||[]).forEach(w=>set.add(w));
  const ov = loc.diasOv || {};
  Object.keys(ov).forEach(k=>{ if(ov[k]===true) set.add(+k); else if(ov[k]===false) set.delete(+k); });
  return set;
}
function nCambios(loc){ return Object.keys(loc.diasOv||{}).length + (loc.diasNA||[]).length; }
// estado de un día en la locación: undefined = sigue al proyecto, true = NA, false = Aplica
function pasarEstadoLoc(loc, w){
  loc.diasOv = loc.diasOv || {};
  loc.diasNA = (loc.diasNA||[]).filter(x=>x!==w);
  const cur = loc.diasOv[w];
  if(cur===undefined) loc.diasOv[w] = true;
  else if(cur===true) loc.diasOv[w] = false;
  else delete loc.diasOv[w];
}
function chipLoc(loc, idx, w){
  const v = (loc.diasOv||{})[w], legacy = (loc.diasNA||[]).indexOf(w)>=0;
  const est = legacy ? true : v;
  const cls = est===true ? ' na' : (est===false ? ' ok' : '');
  const txt = est===true ? 'NA' : (est===false ? 'Aplica' : 'Igual');
  return `<button type="button" class="chip l-dia${cls}" data-idx="${idx}" data-w="${w}">${DIAS_CORTO[w]}<small>${txt}</small></button>`;
}

function renderDiasNA(){
  const box = document.getElementById('diasNaBox');
  if(!box) return;
  const proys = [], vistos = new Set();
  STATE.locs.filter(l=>l.generar==='SI').forEach(l=>{
    const p = projOf(l), k = normProy(p);
    if(!vistos.has(k)){ vistos.add(k); proys.push(p); }
  });
  diasNaProys = proys;
  if(!proys.length){ box.innerHTML = '<div class="hint">Marca al menos una locación para generar.</div>'; return; }
  const fechas = fechasSemana();
  box.innerHTML = '<div class="hint" style="margin:0 0 10px">Tú decides cada día. Un día NA sale con NA en todo el día, incluido el cuadro de firmas. Un día que aplica sale sin NA sueltos. Los NA propios del formulario, como Cambio de alfombra, no se tocan.</div>' +
    proys.map((p,pi)=>{
      const hab = habitualesDe(p);
      const chipsHab = DIAS_CORTO.map((n,w)=>{
        const on = hab.indexOf(w)>=0;
        return `<button type="button" class="chip${on?' na':''}" data-p="${pi}" data-w="${w}" data-kind="hab" aria-pressed="${on}">${n}<small>${on?'NA':'Aplica'}</small></button>`;
      }).join('');
      const nas = [];
      const chipsSem = DIAS_CORTO.map((n,w)=>{
        const d = fechas[w], na = esNAsemana(p, w, fechas);
        if(na) nas.push(DIAS[w] + (d?' '+fmtDM(d):''));
        return `<button type="button" class="chip${na?' na':''}" data-p="${pi}" data-w="${w}" data-kind="sem" aria-pressed="${na}" ${d?'':'disabled'}>${n}<small>${d?fmtDM(d):'--'}</small><small>${na?'NA':'Aplica'}</small></button>`;
      }).join('');
      const resumen = nas.length
        ? `<div class="resumenNA">NA en: ${esc(nas.join(', '))}. Los demás días aplican.</div>`
        : `<div class="resumenNA ninguno">Todos los días aplican esta semana. No se escribe NA en ningún día.</div>`;
      return `<div class="proyblock"><h3>${esc(p||'(sin nombre de proyecto)')}</h3>
        <div class="lbl">Siempre sin servicio en este proyecto</div><div class="chips">${chipsHab}</div>
        <div class="lbl">Esta semana: toca un día para marcarlo NA (feriado) o para quitarlo</div><div class="chips">${chipsSem}</div>
        ${resumen}</div>`;
    }).join('');
  box.onclick = e=>{
    const b = e.target.closest('.chip');
    if(!b || b.disabled) return;
    const p = diasNaProys[+b.dataset.p], w = +b.dataset.w, key = normProy(p);
    if(b.dataset.kind==='hab'){
      const set = new Set(STATE.habituales[key]||[]);
      if(set.has(w)) set.delete(w); else set.add(w);
      const arr = Array.from(set).sort((a,b)=>a-b);
      if(arr.length) STATE.habituales[key] = arr; else STATE.habituales[key] = [];
    } else {
      const fechas2 = fechasSemana(), d = fechas2[w];
      if(!d) return;
      const nuevo = !esNAsemana(p, w, fechas2);
      const base = habitualesDe(p).indexOf(w) >= 0;
      const k = key+'|'+toISO(d);
      if(nuevo===base) delete STATE.excepciones[k]; else STATE.excepciones[k] = nuevo;
    }
    saveState(); renderDiasNA();
  };
}

/* Ajusta la plantilla según los días elegidos (0=Lunes ... 6=Domingo):
   - Día NA: escribe NA en todas las celdas vacías de ese día (requerimientos y cuadro de firmas).
   - Día que aplica: quita los NA sueltos de la plantilla, pero solo donde ese turno (TA/TB/TC)
     está en blanco de lunes a viernes. Los NA propios del formulario (filas que nunca aplican,
     turno C del consultorio, etc.) no se tocan. */
function aplicarNA(xml, naSet){
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  if(doc.getElementsByTagName('parsererror').length) throw new Error('No se pudo leer la plantilla para marcar los NA.');
  const hijos = (el,n)=>Array.prototype.filter.call(el.childNodes, x=>x.nodeType===1 && x.namespaceURI===WNS && x.localName===n);
  const texto = el=>Array.prototype.map.call(el.getElementsByTagNameNS(WNS,'t'), t=>t.textContent).join('').trim();
  const crear = n=>doc.createElementNS(WNS, 'w:'+n);
  const tbl = doc.getElementsByTagNameNS(WNS,'tbl')[0];
  if(!tbl) throw new Error('La plantilla no tiene la tabla esperada.');
  const celdas = tr=>{
    let col = 0;
    return hijos(tr,'tc').map(tc=>{
      const pr = hijos(tc,'tcPr')[0]; let gs = 1;
      if(pr){ const g = hijos(pr,'gridSpan')[0]; if(g) gs = parseInt(g.getAttributeNS(WNS,'val'),10) || 1; }
      const o = {tc:tc, col:col, gs:gs, text:texto(tc)}; col += gs; return o;
    });
  };
  const cel = hijos(tbl,'tr').map(celdas);
  const tieneDias = cs=>['Lunes','Martes','Domingo'].every(n=>cs.some(c=>c.text===n));
  function ponerNA(tc, turno){
    const p = hijos(tc,'p')[0]; if(!p) return;
    const sz = turno ? '16' : '12';
    const r = crear('r'), rpr = crear('rPr'), f = crear('rFonts');
    f.setAttributeNS(WNS,'w:ascii','Times New Roman'); rpr.appendChild(f);
    rpr.appendChild(crear('b')); rpr.appendChild(crear('bCs'));
    const s1 = crear('sz'); s1.setAttributeNS(WNS,'w:val',sz); rpr.appendChild(s1);
    const s2 = crear('szCs'); s2.setAttributeNS(WNS,'w:val',sz); rpr.appendChild(s2);
    r.appendChild(rpr);
    const t = crear('t'); t.textContent = 'NA'; r.appendChild(t);
    p.appendChild(r);
    if(turno){
      const ppr = hijos(p,'pPr')[0];
      if(ppr && !hijos(ppr,'jc')[0]){
        const jc = crear('jc'); jc.setAttributeNS(WNS,'w:val','center');
        const rp = hijos(ppr,'rPr')[0];
        if(rp) ppr.insertBefore(jc, rp); else ppr.appendChild(jc);
      }
    }
  }
  function limpiar(tc){
    hijos(tc,'p').forEach(p=>hijos(p,'r').forEach(r=>p.removeChild(r)));
  }
  let n = 0, c = 0;
  const hdr = cel.findIndex(tieneDias);
  if(hdr < 0) throw new Error('No se encontraron los días en la plantilla.');
  const rango = [];
  DIAS.forEach((nm,w)=>{ const x = cel[hdr].find(x=>x.text===nm); rango[w] = [x.col, x.col+x.gs-1]; });
  const fin = cel.findIndex((cs,i)=>i>hdr && cs.some(x=>x.text.indexOf('Firma trabajadora')===0));
  if(fin < 0) throw new Error('No se encontró el final de la tabla de requerimientos.');
  for(let r=hdr+1; r<fin; r++){
    const cs = cel[r];
    if(cs.some(x=>/^TA\b/.test(x.text))) continue;
    const dia = rango.map(rg=>cs.filter(x=>x.col>=rg[0] && x.col<=rg[1]));
    // turnos que la plantilla marca NA de lunes a viernes (intencionales)
    const k3 = dia[0].length;
    const baseNA = [];
    for(let k=0;k<k3;k++){
      let cuenta = 0, comp = 0;
      for(let w=0; w<5; w++){ if(dia[w].length===k3){ comp++; if(dia[w][k].text==='NA') cuenta++; } }
      baseNA[k] = comp>0 && cuenta*2 > comp;
    }
    for(let w=0; w<7; w++){
      dia[w].forEach((x,k)=>{
        if(naSet.has(w)){
          if(x.text===''){ ponerNA(x.tc,false); n++; }
        } else if(x.text==='NA' && dia[w].length===k3 && !baseNA[k]){
          limpiar(x.tc); c++;
        }
      });
    }
  }
  const hT = cel.findIndex((cs,i)=>i>fin && tieneDias(cs));
  if(hT >= 0){
    const colDia = {};
    DIAS.forEach((nm,w)=>{ const x = cel[hT].find(x=>x.text===nm); if(x) colDia[w] = x.col; });
    let finT = cel.findIndex((cs,i)=>i>hT && cs.some(x=>x.text.indexOf('Aclaraciones')===0));
    if(finT < 0) finT = cel.length;
    for(let r=hT+1; r<finT; r++){
      const cs = cel[r];
      if(!cs.length || !/^[ABC]$/.test(cs[0].text)) continue;
      naSet.forEach(w=>{
        const x = cs.find(x=>x.col===colDia[w]);
        if(x && x.text===''){ ponerNA(x.tc,true); n++; }
      });
    }
  }
  let out = new XMLSerializer().serializeToString(doc);
  if(!/^<\?xml/.test(out)) out = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' + out;
  return {xml: out, n: n, c: c};
}

  if(s===undefined||s===null) return "";
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

/* ---------- IMPORTAR / EXPORTAR EXCEL ---------- */
function handleImportExcel(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(evt){
    try{
      const wb = XLSX.read(evt.target.result, {type:'array'});
      if(wb.SheetNames.includes('Periodo')){
        const ws = wb.Sheets['Periodo'];
        const rows = XLSX.utils.sheet_to_json(ws, {header:1});
        const map = {};
        rows.forEach(r=>{ if(r[0] && r[1]!==undefined) map[String(r[0]).trim()] = r[1]; });
        if(map['Mes']) STATE.periodo.mes = String(map['Mes']);
        if(map['Año']) STATE.periodo.anio = parseInt(map['Año'])||STATE.periodo.anio;
        if(map['Proyecto por defecto']) STATE.periodo.proyecto = String(map['Proyecto por defecto']);
        if(map['Encargado por defecto']) STATE.periodo.encargado = String(map['Encargado por defecto']);
        if(map['Fecha inicio']!==undefined) STATE.periodo.fechaInicioISO = anyToISO(map['Fecha inicio']);
        if(map['Fecha final']!==undefined) STATE.periodo.fechaFinalISO = anyToISO(map['Fecha final']);
      }
      if(wb.SheetNames.includes('Locaciones')){
        const ws = wb.Sheets['Locaciones'];
        const rows = XLSX.utils.sheet_to_json(ws, {header:1});
        const newLocs = [];
        for(let i=1;i<rows.length;i++){
          const r = rows[i];
          if(!r || !r[1]) continue;
          newLocs.push({
            generar: (r[0]||'SI').toString().toUpperCase()==='SI' ? 'SI':'NO',
            archivo: String(r[1]||'').trim(),
            tipo: String(r[2]||'Banos_Hombres').trim(),
            proyecto: String(r[3]||''),
            encargado: String(r[4]||''),
            area: String(r[5]||'')
          });
        }
        if(newLocs.length) STATE.locs = newLocs;
      }
      saveState();
      renderApp();
      alert('Excel importado correctamente.');
    }catch(err){
      alert('No se pudo leer el Excel. Verificá que tenga las hojas "Periodo" y "Locaciones" con el mismo formato del control original.');
      console.error(err);
    }
  };
  reader.readAsArrayBuffer(file);
  e.target.value = '';
}
function anyToISO(v){
  function pad(n){ return String(n).padStart(2,'0'); }
  if(v instanceof Date) return `${v.getFullYear()}-${pad(v.getMonth()+1)}-${pad(v.getDate())}`;
  if(typeof v === 'number'){
    const d = XLSX.SSF.parse_date_code(v);
    if(d) return `${d.y}-${pad(d.m)}-${pad(d.d)}`;
  }
  const s = String(v).trim();
  // dd/mm/yyyy
  let m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
  if(m) return `${m[3]}-${pad(m[1])}-${pad(m[2])}`;
  // yyyy-mm-dd ya viene bien
  m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m) return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
  return "";
}
function exportExcel(){
  const p = STATE.periodo;
  const wsPeriodo = XLSX.utils.aoa_to_sheet([
    ["Campo","Valor"],
    ["Mes", p.mes],
    ["Fecha inicio", isoToDDMMYYYY(p.fechaInicioISO)],
    ["Fecha final", isoToDDMMYYYY(p.fechaFinalISO)],
    ["Año", p.anio],
    ["Proyecto por defecto", p.proyecto],
    ["Encargado por defecto", p.encargado]
  ]);
  const wsLocRows = [["Generar","Archivo","Tipo plantilla","Proyecto","Encargado","Area"]];
  STATE.locs.forEach(l=> wsLocRows.push([l.generar,l.archivo,l.tipo,l.proyecto,l.encargado,l.area]));
  const wsLoc = XLSX.utils.aoa_to_sheet(wsLocRows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, wsPeriodo, "Periodo");
  XLSX.utils.book_append_sheet(wb, wsLoc, "Locaciones");
  XLSX.writeFile(wb, `Control_Bitacoras_${p.fechaInicio}_${p.fechaFinal}.xlsx`.replace(/\s+/g,"_"));
}

/* ---------- GENERAR BITACORAS ---------- */
async function generarBitacoras(){
  const statusEl = document.getElementById('genStatus');
  const p = STATE.periodo;
  const seleccion = STATE.locs.filter(l=>l.generar==='SI');
  if(seleccion.length===0){
    statusEl.className='status err'; statusEl.textContent='No hay locaciones marcadas para generar.'; return;
  }
  statusEl.className='status loading'; statusEl.textContent='Generando documentos...';
  try{
    const zip = new JSZip();
    let conNA = 0;
    for(const loc of seleccion){
      const b64 = TEMPLATES_B64[loc.tipo];
      if(!b64){ console.warn('Tipo de plantilla no encontrado:', loc.tipo); continue; }
      const bytes = b64ToBytes(b64);
      const pzip = new PizZip(bytes);
      const naSet = diasNAde(loc);
      const res = aplicarNA(pzip.file('word/document.xml').asText(), naSet);
      pzip.file('word/document.xml', res.xml);
      if(naSet.size) conNA++;
      const doc = new window.docxtemplater(pzip, {paragraphLoop:true, linebreaks:true});
      doc.render({
        mes: p.mes,
        fecha_inicio: isoToDDMMYYYY(p.fechaInicioISO),
        fecha_final: isoToDDMMYYYY(p.fechaFinalISO),
        anio: String(p.anio),
        proyecto: loc.proyecto || p.proyecto,
        encargado: loc.encargado || p.encargado,
        area: loc.area
      });
      const out = doc.getZip().generate({type:"uint8array", mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
      const filename = (loc.archivo || loc.area || 'bitacora').replace(/[\\/:*?"<>|]/g,'_') + '.docx';
      zip.file(filename, out);
    }
    const zipBlob = await zip.generateAsync({type:"blob"});
    const zipName = `Bitacoras_${isoToDDMMYYYY(p.fechaInicioISO)}_al_${isoToDDMMYYYY(p.fechaFinalISO)}.zip`.replace(/\//g,"-").replace(/\s+/g,"_");
    saveAs(zipBlob, zipName);
    statusEl.className='status ok';
    statusEl.textContent = `Listo: ${seleccion.length} documento(s) generado(s) en ${zipName}.` + (conNA ? ` Con días NA marcados en ${conNA}.` : ' Todos los días aplican.');
  }catch(e){
    console.error(e);
    statusEl.className='status err';
    statusEl.textContent = 'Ocurrió un error generando los documentos: ' + (e.message||e);
  }
}

loadEngine();
